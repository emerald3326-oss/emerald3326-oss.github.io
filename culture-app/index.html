<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문화의 속성 - 삼성중학교 소정샘</title>
<style>
:root{
  --bg:#f4f7fb; --card:#fff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
  --main:#4f46e5; --main2:#7c3aed; --ok:#16a34a; --bad:#dc2626;
  --c1:#ef4444; --c2:#f59e0b; --c3:#10b981; --c4:#3b82f6; --c5:#8b5cf6;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);
  padding:76px 84px 84px 12px}
button{font-family:inherit;cursor:pointer}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:linear-gradient(90deg,var(--main),var(--main2));
  color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{margin:0;font-size:clamp(15px,2.4vw,22px)}
header span{font-size:clamp(12px,1.8vw,15px);opacity:.95}
nav{display:flex;gap:8px;max-width:900px;margin:0 auto 14px;flex-wrap:wrap}
nav button{flex:1;min-width:120px;padding:12px;border:2px solid var(--main);background:#fff;color:var(--main);
  border-radius:12px;font-weight:700;font-size:15px}
nav button.on{background:var(--main);color:#fff}
main{max-width:900px;margin:0 auto}
.screen{display:none}.screen.on{display:block}
.panel{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
h2{margin:0 0 14px;font-size:20px}
.icons{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.icon{flex:1;min-width:130px;max-width:210px;text-align:center;text-decoration:none;color:var(--ink);
  background:#fff;border:2px solid var(--line);border-radius:16px;padding:18px 8px;transition:.15s;display:block}
.icon:hover{transform:translateY(-3px);border-color:var(--main)}
.icon .e{font-size:48px;display:block}
.icon b{display:block;margin-top:6px}
.attr-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.attr-btn{width:120px;padding:14px 6px;border:3px solid transparent;border-radius:16px;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:center;font-weight:700}
.attr-btn .e{font-size:38px;display:block}
.attr-btn.on{border-color:var(--col);background:color-mix(in srgb,var(--col) 10%,#fff)}
.meaning{border-left:6px solid var(--col,var(--main));background:#f9fafb;border-radius:8px;padding:14px 16px;font-size:17px;line-height:1.7}
.ex-btn{margin-top:14px;display:block;margin-inline:auto;padding:12px 28px;border:0;border-radius:40px;
  background:var(--col,var(--main));color:#fff;font-weight:700;font-size:16px}
.example{margin-top:12px;background:#fffbeb;border:2px dashed #f59e0b;border-radius:12px;padding:14px 16px;line-height:1.7;display:none}
.example.on{display:block}
.hint{color:var(--sub);text-align:center;padding:20px}
.big-btn{padding:14px 30px;border:0;border-radius:40px;background:var(--main);color:#fff;font-size:18px;font-weight:700}
.big-btn:disabled{opacity:.5}
input[type=text],input[type=number],textarea{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:17px}
.center{text-align:center}
.card{border:3px solid var(--main);border-radius:20px;padding:18px;text-align:center;background:#fff;margin:12px 0}
.card .pic{font-size:72px;line-height:1.2}
.card p{font-size:18px;line-height:1.6;margin:8px 0 0}
.prog{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--main);width:0;transition:.3s}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:14px;margin-bottom:6px}
.fb{min-height:28px;font-weight:700;margin-top:10px;text-align:center;font-size:17px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.score{font-size:56px;font-weight:800;color:var(--main);margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
.save{font-size:14px;color:var(--sub);margin-top:6px}
footer{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:center;gap:12px;padding:8px 84px 8px 12px}
footer a{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:30px;padding:8px 14px;font-weight:700;font-size:14px}
footer a:hover{background:#eef2ff}
#tools{position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:10px}
#tools button{width:64px;height:64px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);
  font-size:11px;font-weight:700;line-height:1.2}
#tools button span{display:block;font-size:26px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.box{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:440px;text-align:center;max-height:90vh;overflow:auto}
.box h3{margin:0 0 12px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.sm{padding:10px 18px;border:0;border-radius:10px;background:var(--main);color:#fff;font-weight:700;font-size:15px}
.sm.gray{background:#9ca3af}
.pick{font-size:44px;font-weight:800;color:var(--main);margin:14px 0;min-height:56px}
.time{font-size:72px;font-weight:800;font-variant-numeric:tabular-nums;margin:8px 0}
.time.end{color:var(--bad);animation:bl .6s infinite}
@keyframes bl{50%{opacity:.3}}
#hand{position:fixed;inset:0;z-index:120;background:rgba(255,255,255,.93);display:none;flex-direction:column;
  align-items:center;justify-content:center;font-size:clamp(120px,30vw,260px);animation:wave 1s infinite}
#hand.on{display:flex}
#hand small{font-size:22px;color:var(--sub)}
@keyframes wave{50%{transform:rotate(12deg)}}
.box.wide{max-width:640px}
.box label{font-weight:700;font-size:14px}
.sm.big{padding:16px 28px;font-size:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin:12px 0}
.cards div{aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;transition:.3s}
.cards div.hit{background:#f59e0b;transform:scale(1.15) rotate(-4deg);box-shadow:0 0 0 3px #fde68a}
.cards div.used{background:#d1d5db;color:#9ca3af}
.cards div.flash{background:#fff;color:var(--main);outline:3px solid var(--main)}
.picked{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:10px}
.picked span{background:#fef3c7;border:2px solid #f59e0b;border-radius:30px;padding:4px 14px;font-weight:800}
#hand b{font-size:clamp(24px,6vw,48px);color:var(--main)}
@media(max-width:600px){body{padding-right:76px}footer{padding-right:76px}footer a{padding:7px 9px;font-size:12px}}
</style>
</head>
<body>

<header>
  <h1>&lt;사회&gt; 수업 주제: 문화의 속성</h1>
  <span>삼성중학교 소정샘</span>
</header>

<main>
  <nav>
    <button class="on" data-s="s1">📚 수업 들어가기</button>
    <button data-s="s2">🌏 문화의 속성</button>
    <button data-s="s3">🎮 속성 카드 맞추기 게임</button>
  </nav>

  <!-- 화면 1 -->
  <section id="s1" class="screen on">
    <div class="panel">
      <h2>수업 들어가기</h2>
      <div class="icons">
        <a class="icon" id="lnkVideo" href="https://www.youtube.com/watch?v=yebNIHKAC4A" target="_blank" rel="noopener">
          <span class="e">▶️</span><b>수업 관련 영상</b></a>
        <a class="icon" id="lnkSheet" href="#" target="_blank" rel="noopener">
          <span class="e">📝</span><b>수업 학습지</b></a>
      </div>
    </div>
  </section>

  <!-- 화면 2 -->
  <section id="s2" class="screen">
    <div class="panel">
      <h2>문화의 속성</h2>
      <div class="attr-row" id="attrRow"></div>
      <div id="attrBody"><div class="hint">👆 속성 아이콘을 눌러 보세요!</div></div>
    </div>
  </section>

  <!-- 화면 3 -->
  <section id="s3" class="screen">
    <div class="panel">
      <h2>문화의 속성 카드 맞추기 게임</h2>

      <div id="gStart" class="center">
        <p>이름을 입력하고 시작하세요. 카드의 그림과 설명을 보고 어떤 속성인지 <b>직접 써 보세요!</b><br>
        (공유성 · 학습성 · 변동성 · 축적성 · 전체성) — 10문제 1세트</p>
        <input type="text" id="pName" maxlength="20" placeholder="이름을 입력하세요" style="max-width:320px">
        <p><button class="big-btn" id="btnStart">게임 시작</button></p>
      </div>

      <div id="gPlay" style="display:none">
        <div class="meta"><span id="qNo"></span><span id="qWho"></span></div>
        <div class="prog"><i id="bar"></i></div>
        <div class="card"><div class="pic" id="cPic"></div><p id="cTxt"></p></div>
        <input type="text" id="ans" placeholder="어떤 속성일까요? (예: 공유성)" autocomplete="off">
        <div class="fb" id="fb"></div>
        <div class="center" style="margin-top:8px">
          <button class="big-btn" id="btnSubmit">제출</button>
          <button class="big-btn" id="btnNext" style="display:none">다음 ▶</button>
        </div>
      </div>

      <div id="gEnd" class="center" style="display:none">
        <h2 id="eName"></h2>
        <div class="score" id="eScore"></div>
        <div id="eMsg"></div>
        <div class="save" id="eSave"></div>
        <div style="text-align:left"><table id="eTbl"></table></div>
        <p><button class="big-btn" id="btnAgain">다시 도전 🔁</button></p>
      </div>
    </div>
  </section>
</main>

<footer>
  <a href="https://app.notion.com/p/2ceaf6bab4c1818b9a12cd98c4a511db?v=2ceaf6bab4c18181b273000c1d27f588&source=copy_link" target="_blank" rel="noopener">📓 수업 노션</a>
  <a href="https://www.classting.com/home" target="_blank" rel="noopener">🏫 클래스팅</a>
  <a href="https://tooning.io/" target="_blank" rel="noopener">🎨 투닝</a>
</footer>

<div id="tools">
  <button id="tPick"><span>🎯</span>발표자<br>뽑기</button>
  <button id="tTimer"><span>⏱️</span>타이머</button>
  <button id="tHand"><span>🙋</span>손들기</button>
</div>

<!-- 발표자 뽑기 -->
<div class="modal" id="mPick"><div class="box wide">
  <h3>🎯 발표자 뽑기</h3>
  <div class="row" style="margin-top:0">
    <label>학생 수 (1~40)
      <input type="number" id="pTotal" min="1" max="40" value="" placeholder="예: 30" style="width:90px;text-align:center"></label>
    <button class="sm" id="pMake">카드 만들기</button>
  </div>
  <div class="cards" id="pCards"></div>
  <div class="row" id="pCtl" style="display:none">
    <label>발표자 수
      <input type="number" id="pCount" min="1" value="3" style="width:80px;text-align:center"></label>
    <button class="sm" id="pGo">🎲 뽑기!</button>
    <button class="sm gray" id="pReset">처음부터</button>
  </div>
  <div class="pick" id="pRes"></div>
  <div class="picked" id="pList"></div>
  <div class="row"><button class="sm gray" data-close>닫기</button></div>
</div></div>

<!-- 타이머 -->
<div class="modal" id="mTimer"><div class="box">
  <h3>⏱️ 타이머</h3>
  <div class="time" id="tDisp">00:00</div>
  <div class="row" id="tPre">
    <button class="sm big" data-min="1">1분</button>
    <button class="sm big" data-min="3">3분</button>
    <button class="sm big" data-min="5">5분</button>
  </div>
  <div class="row">
    <button class="sm" id="tPause" style="display:none">일시정지</button>
    <button class="sm gray" id="tStop" style="display:none">멈추기</button>
    <button class="sm gray" data-close>닫기</button>
  </div>
</div></div>

<div id="hand"><span>🙋</span><b>손들었어요!</b><small>화면을 누르면 닫혀요</small></div>

<script>

  {p:'🔬', t:'앞선 세대의 과학 지식 위에 새로운 발견이 계속 더해져 기술이 발전해 왔다.', a:'축적성'},
  {p:'🏯', t:'조상들의 건축 기술과 지혜가 대대로 전해지고 보태져 한옥 문화가 더욱 풍부해졌다.', a:'축적성'},
  {p:'🎓', t:'대입 제도가 바뀌면 학교 수업, 학원 커리큘럼, 주말 활동, 학생의 수면 시간까지 함께 변한다.', a:'전체성'},
  {p:'🏠', t:'온돌(난방), 한복, 좌식 생활 방식이 서로 연결되어 우리나라 주거 문화를 이룬다.', a:'전체성'},
  {p:'💻', t:'스마트폰이 보급되자 소통 방식, 쇼핑, 학습, 여가 문화가 한꺼번에 달라졌다.', a:'전체성'},
  {p:'🍱', t:'쌀 중심 농경 문화가 음식, 명절, 공동체 놀이, 노동 방식에까지 서로 영향을 주고 있다.', a:'전체성'}
];

/* ===== 공통 ===== */
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

$$('nav button').forEach(function(b){b.onclick=function(){
  $$('nav button').forEach(function(x){x.classList.toggle('on',x===b)});
  $$('.screen').forEach(function(s){s.classList.toggle('on',s.id===b.dataset.s)});
}});

if(WORKSHEET_URL){$('#lnkSheet').href=WORKSHEET_URL}
else{$('#lnkSheet').onclick=function(e){e.preventDefault();alert('수업 학습지 링크가 아직 설정되지 않았어요. (index.html 의 WORKSHEET_URL)')}}

/* ===== 화면 2: 속성 ===== */
(function(){
  var row=$('#attrRow');
  ATTRS.forEach(function(a,i){
    var b=document.createElement('button');
    b.className='attr-btn';b.style.setProperty('--col',a.c);
    b.innerHTML='<span class="e">'+a.e+'</span>'+a.k;
    b.onclick=function(){
      $$('.attr-btn').forEach(function(x){x.classList.remove('on')});b.classList.add('on');
      $('#attrBody').innerHTML='<div class="meaning" style="--col:'+a.c+'"><b>'+a.e+' '+a.k+'</b><br>'+esc(a.m)+'</div>'
        +'<button class="ex-btn" style="--col:'+a.c+'">💡 대표적인 예</button>'
        +'<div class="example">'+esc(a.x)+'</div>';
      var eb=$('.ex-btn');eb.onclick=function(){$('.example').classList.toggle('on')};
    };
    row.appendChild(b);
  });
})();

/* ===== 화면 3: 게임 ===== */
var G={name:'',qs:[],i:0,ok:0,log:[],t0:0,done:false};

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function norm(s){return String(s).replace(/\s/g,'').replace(/성$/,'')}

function show(id){['gStart','gPlay','gEnd'].forEach(function(x){$('#'+x).style.display=(x===id?'block':'none')})}

$('#btnStart').onclick=function(){
  var n=$('#pName').value.trim();
  if(!n){alert('이름을 입력해 주세요.');$('#pName').focus();return}
  G={name:n,qs:shuffle(CARDS).slice(0,10),i:0,ok:0,log:[],t0:Date.now(),done:false};
  $('#qWho').textContent='👤 '+n;
  show('gPlay');render();
};
$('#pName').addEventListener('keydown',function(e){if(e.key==='Enter')$('#btnStart').click()});

function render(){
  var q=G.qs[G.i];
  $('#qNo').textContent='문제 '+(G.i+1)+' / '+G.qs.length;
  $('#bar').style.width=(G.i/G.qs.length*100)+'%';
  $('#cPic').textContent=q.p;$('#cTxt').textContent=q.t;
  var a=$('#ans');a.value='';a.disabled=false;a.focus();
  $('#fb').textContent='';$('#fb').className='fb';
  $('#btnSubmit').style.display='';$('#btnNext').style.display='none';
}

function submit(){
  var q=G.qs[G.i],v=$('#ans').value.trim();
  if(!v){$('#fb').textContent='답을 써 주세요!';$('#fb').className='fb bad';return}
  var right=norm(v)===norm(q.a);
  if(right)G.ok++;
  G.log.push({q:G.i+1,a:q.a,u:v,r:right});
  $('#ans').disabled=true;
  $('#fb').textContent=right?'⭕ 정답! '+q.a:'❌ 아쉬워요. 정답은 「'+q.a+'」';
  $('#fb').className='fb '+(right?'ok':'bad');
  $('#btnSubmit').style.display='none';
  var nb=$('#btnNext');nb.style.display='';nb.textContent=(G.i===G.qs.length-1?'결과 보기 🏁':'다음 ▶');nb.focus();
}
$('#btnSubmit').onclick=submit;
$('#ans').addEventListener('keydown',function(e){if(e.key==='Enter'&&$('#btnSubmit').style.display!=='none')submit()});
$('#btnNext').onclick=function(){
  if(G.i<G.qs.length-1){G.i++;render()}else finish();
};

function finish(){
  show('gEnd');
  var total=G.qs.length,sec=Math.round((Date.now()-G.t0)/1000);
  $('#eName').textContent=G.name+' 님의 결과';
  $('#eScore').textContent=G.ok+' / '+total;
  $('#eMsg').textContent=G.ok===total?'🎉 완벽해요! 문화의 속성 마스터!':G.ok>=7?'👏 훌륭해요!':G.ok>=4?'🙂 조금만 더 복습해 볼까요?':'💪 수업 내용을 다시 보고 도전해 봐요!';
  $('#eTbl').innerHTML='<tr><th>#</th><th>내 답</th><th>정답</th><th></th></tr>'+G.log.map(function(l){
    return '<tr><td>'+l.q+'</td><td>'+esc(l.u)+'</td><td>'+l.a+'</td><td>'+(l.r?'⭕':'❌')+'</td></tr>'}).join('');
  var sv=$('#eSave');sv.textContent='⏳ 구글 시트에 기록 중...';
  var detail=G.log.map(function(l){return l.q+':'+l.a+'/'+l.u+(l.r?'O':'X')}).join(' | ');
  var payload={name:G.name,correct:G.ok,total:total,seconds:sec,detail:detail};
  if(window.google&&google.script&&google.script.run){
    google.script.run.withSuccessHandler(function(r){sv.textContent='✅ 기록 완료 ('+r.attempt+'번째 시도)'})
      .withFailureHandler(function(e){sv.textContent='⚠️ 기록 실패: '+(e&&e.message||e)}).saveResult(payload);
  }else sv.textContent='ℹ️ (미리보기 모드) Apps Script 환경에서만 시트에 기록됩니다.';
}
$('#btnAgain').onclick=function(){
  G={name:G.name,qs:shuffle(CARDS).slice(0,10),i:0,ok:0,log:[],t0:Date.now()};
  show('gPlay');render();
};

/* ===== 우측 수업 도구 ===== */
function open_(id){$('#'+id).classList.add('on')}
$$('[data-close]').forEach(function(b){b.onclick=function(){b.closest('.modal').classList.remove('on')}});
$$('.modal').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)m.classList.remove('on')})});

// 효과음 (사용자가 버튼을 누른 뒤에만 재생 가능)
var AC=null;
function audio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(freq,start,dur,type){var c=audio();if(!c)return;var o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.value=freq;o.connect(g);g.connect(c.destination);
  var t=c.currentTime+start;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.4,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.05)}
function alarm(){for(var i=0;i<4;i++){tone(988,i*0.5,0.18,'square');tone(988,i*0.5+0.22,0.18,'square')}}
function ding(){tone(784,0,0.35);tone(1175,0.18,0.6)}
function tick(){tone(660,0,0.12,'triangle')}

// 발표자 뽑기: 학생 수 입력 -> 번호 카드 -> 발표자 수만큼 차례로 뽑기
var P={n:0,left:[],want:0,done:[],busy:false};
$('#tPick').onclick=function(){audio();open_('mPick')};
$('#pMake').onclick=function(){
  var n=parseInt($('#pTotal').value);
  if(!(n>=1&&n<=40)){alert('1~40 사이의 숫자를 입력해 주세요.');return}
  P.n=n;P.left=[];P.done=[];P.busy=false;
  var box=$('#pCards');box.innerHTML='';
  for(var i=1;i<=n;i++){P.left.push(i);var d=document.createElement('div');d.id='pc'+i;d.textContent=i;box.appendChild(d)}
  $('#pCount').max=n;$('#pCtl').style.display='flex';$('#pRes').textContent='';$('#pList').innerHTML='';
};
$('#pReset').onclick=function(){if(P.n)$('#pMake').onclick()};
$('#pGo').onclick=function(){
  if(P.busy)return;
  var want=Math.min(parseInt($('#pCount').value)||1,P.n);
  if(P.done.length>=want){$('#pRes').textContent='🎉 모두 뽑았어요!';return}
  if(!P.left.length){$('#pRes').textContent='남은 번호가 없어요';return}
  P.busy=true;var idx=Math.floor(Math.random()*P.left.length),pick=P.left[idx],n=0,last=null;
  var iv=setInterval(function(){
    if(last)last.classList.remove('flash');
    var r=P.left[Math.floor(Math.random()*P.left.length)];last=$('#pc'+r);last.classList.add('flash');
    $('#pRes').textContent=r+'번';tick();
    if(++n>14){
      clearInterval(iv);last.classList.remove('flash');
      P.left.splice(idx,1);P.done.push(pick);
      $('#pc'+pick).classList.add('hit');
      $('#pRes').textContent='🎉 '+pick+'번!';ding();
      var sp=document.createElement('span');sp.textContent=P.done.length+'. '+pick+'번';$('#pList').appendChild(sp);
      setTimeout(function(){$('#pc'+pick).classList.remove('hit');$('#pc'+pick).classList.add('used')},900);
      P.busy=false;
      if(P.done.length>=want)$('#pRes').textContent+='  (모두 뽑았어요!)';
    }
  },90);
};

// 타이머: 1·3·5분 선택 -> 카운트다운 -> 종료 시 알림음
var T={left:0,iv:null,paused:false};
function fmt(s){return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2)}
function tShow(end){var d=$('#tDisp');d.textContent=fmt(T.left);d.classList.toggle('end',!!end)}
function tClear(){clearInterval(T.iv);T.iv=null;T.paused=false;$('#tPause').style.display=$('#tStop').style.display='none';$('#tPause').textContent='일시정지'}
$('#tTimer').onclick=function(){audio();open_('mTimer');if(!T.iv){tShow(false)}};
$$('[data-min]').forEach(function(b){b.onclick=function(){
  audio();tClear();T.left=parseInt(b.dataset.min)*60;tShow(false);
  $('#tPause').style.display=$('#tStop').style.display='';
  T.iv=setInterval(function(){
    if(T.paused)return;
    T.left--;
    if(T.left<=0){T.left=0;tClear();tShow(true);alarm()}else tShow(false);
  },1000);
}});
$('#tPause').onclick=function(){T.paused=!T.paused;this.textContent=T.paused?'계속':'일시정지'};
$('#tStop').onclick=function(){tClear();T.left=0;tShow(false)};

// 손들기: 누르면 알림음 + 손 화면
$('#tHand').onclick=function(){audio();ding();$('#hand').classList.add('on')};
$('#hand').onclick=function(){$('#hand').classList.remove('on')};
</script>
